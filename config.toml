# Which listings you want to hear about. Empty list = no filter on that field.
[filters]
countries = ["Netherlands"]
cities = ["Utrecht"]

# Which sites to watch: "plaza", "fizz"
[sources]
enabled = ["plaza", "fizz"]

# Semi-automatic applying (Plaza only): new Plaza listings get an "Apply now" button in Telegram.
# Nothing is ever sent without you tapping it.
[apply]
enabled = true
max_per_day = 3  # safety cap on successful Apply-button taps per day (auto-applies don't count)

# Automatic applying (Plaza only): react by itself to the first new listing Plaza accepts you for,
# at most once per auto_every_minutes. All other new listings still get the "Apply now" button.
auto = true
auto_every_minutes = 3

# Polling interval in seconds; each wait is random between min and max.
[watch]
interval_min = 4
interval_max = 8
